[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit", "docx"]

# Route all /api/* requests directly to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
