<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>IGNOU Project Hub</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Store current path and redirect to index.html with relative base
      var pathSegments = window.location.pathname.split('/');
      var repoName = pathSegments[1] ? '/' + pathSegments[1] : '';
      
      // If deployed in a subpath, redirect to root index.html preserving URL
      window.location.replace(
        window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '') +
        repoName + '/?' + encodeURIComponent(window.location.pathname.slice(repoName.length) + window.location.search) +
        window.location.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to IGNOU Project Hub...</p>
  </body>
</html>
